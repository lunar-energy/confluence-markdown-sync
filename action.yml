# action.yml
name: confluence-markdown-sync
description: Copy content of a markdown file to a confluence site
branding:
  icon: upload-cloud
  color: blue
inputs:
  from:
    description: Path to the markdown file. Relative to root of repository
    required: true
  to:
    description: The page ID in confluence
    required: true
  cloud:
    description: Atlassian Cloud ID
    required: true
  user:
    description: >
      Email of the account owning the token, for basic auth. Omit for an
      Atlassian service account token, which is sent as a bearer token.
    required: false
  token:
    description: Token for the user
    required: true
runs:
  using: docker
  image: Dockerfile
